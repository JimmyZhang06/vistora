name: framefactory-persistence

# Local-only persistence stack. The credentials below are intentionally
# non-secret development defaults and must not be reused outside this compose project.
# The matching API variables are documented in apps/api/.env.example. When the
# API runs on the host, its default URLs use localhost; from another Compose
# service use postgres, redis, and minio as the host names.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-framefactory}
      POSTGRES_USER: ${POSTGRES_USER:-framefactory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-framefactory-local-only}
    ports:
      - "${PERSISTENCE_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - framefactory-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: deploy/production/Dockerfile
      target: migrate
    environment:
      FRAMEFACTORY_DATABASE_URL: postgresql://${POSTGRES_USER:-framefactory}:${POSTGRES_PASSWORD:-framefactory-local-only}@postgres:5432/${POSTGRES_DB:-framefactory}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: ${FRAMEFACTORY_REDIS_IMAGE:-redis:7.4-alpine}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--protected-mode", "${FRAMEFACTORY_REDIS_PROTECTED_MODE:-yes}"]
    ports:
      - "${PERSISTENCE_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - framefactory-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${FRAMEFACTORY_S3_ACCESS_KEY_ID:-framefactory}
      MINIO_ROOT_PASSWORD: ${FRAMEFACTORY_S3_SECRET_ACCESS_KEY:-framefactory-local-only}
      MINIO_API_CORS_ALLOW_ORIGIN: ${FRAMEFACTORY_S3_CORS_ALLOW_ORIGIN:-http://localhost:4173,http://127.0.0.1:4173}
    ports:
      - "${PERSISTENCE_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${PERSISTENCE_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - framefactory-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${FRAMEFACTORY_S3_ACCESS_KEY_ID:-framefactory}
      MINIO_ROOT_PASSWORD: ${FRAMEFACTORY_S3_SECRET_ACCESS_KEY:-framefactory-local-only}
      FRAMEFACTORY_S3_BUCKET: ${FRAMEFACTORY_S3_BUCKET:-framefactory}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${FRAMEFACTORY_S3_BUCKET}"
        mc anonymous set none "local/$${FRAMEFACTORY_S3_BUCKET}"
    restart: "no"

volumes:
  framefactory-postgres:
  framefactory-redis:
  framefactory-minio:
