name: framefactory-production

# The migration job is the sole schema owner. API and Worker start only after
# its checksum-verified ledger is current.

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  pids_limit: 256
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "5"}

x-app-env: &app-env
  FRAMEFACTORY_ENV: production
  FRAMEFACTORY_REPOSITORY_BACKEND: postgresql
  FRAMEFACTORY_DATABASE_URL_FILE: /run/secrets/database_url
  FRAMEFACTORY_REDIS_ENABLED: "true"
  FRAMEFACTORY_REDIS_URL_FILE: /run/secrets/redis_url
  FRAMEFACTORY_OBJECT_STORAGE_ENABLED: "true"
  FRAMEFACTORY_S3_ENDPOINT_URL: http://s3:9000
  FRAMEFACTORY_S3_BUCKET: ${FF_S3_BUCKET:-framefactory-production}
  FRAMEFACTORY_S3_REGION: ${FF_S3_REGION:-us-east-1}
  FRAMEFACTORY_S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key
  FRAMEFACTORY_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_key
  FRAMEFACTORY_S3_ADDRESSING_STYLE: path
  FRAMEFACTORY_S3_VERIFY_TLS: "false"
  FRAMEFACTORY_S3_CREATE_BUCKET: "true"
  FRAMEFACTORY_DEFAULT_USER_ID: ${FF_DEFAULT_USER_ID:?required}
  FRAMEFACTORY_DEFAULT_WORKSPACE_ID: ${FF_DEFAULT_WORKSPACE_ID:?required}
  FRAMEFACTORY_CORS_ALLOW_ORIGINS: ${FF_CORS_ALLOW_ORIGINS:?required}

services:
  migrate:
    <<: *hardened
    build: {context: ../.., dockerfile: deploy/production/Dockerfile, target: migrate}
    restart: "no"
    environment:
      FRAMEFACTORY_DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
    pids_limit: 64
    cpus: 0.5
    mem_limit: 256m

  api:
    <<: *hardened
    build: {context: ../.., dockerfile: deploy/production/Dockerfile, target: api}
    environment: *app-env
    secrets: [database_url, redis_url, s3_access_key, s3_secret_key]
    tmpfs: ["/tmp:size=256m,mode=1777"]
    ports: ["127.0.0.1:${FF_API_PORT:-8080}:8080"]
    networks: [ingress, backend]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      s3: {condition: service_healthy}
    cpus: 2.0
    mem_limit: 2g

  worker:
    <<: *hardened
    build: {context: ../.., dockerfile: deploy/production/Dockerfile, target: worker}
    environment:
      <<: *app-env
      FRAMEFACTORY_ALLOW_INSECURE_TRANSPORT: "true"
      FRAMEFACTORY_LEGACY_MEDIA_ENABLED: ${FF_LEGACY_MEDIA_ENABLED:-false}
      FRAMEFACTORY_LEGACY_ASSET_ROOT: /opt/framefactory/legacy-media
      FRAMEFACTORY_LEGACY_ASSET_CATALOGS: ${FF_LEGACY_ASSET_CATALOGS:-}
      FRAMEFACTORY_LEGACY_TTS_VOICE: ${FF_LEGACY_TTS_VOICE:-zh-CN-YunjianNeural}
      FRAMEFACTORY_LEGACY_TTS_RATE: ${FF_LEGACY_TTS_RATE:-+25%}
      FRAMEFACTORY_CONTROL_API_URL: http://api:8080
      FRAMEFACTORY_ASSET_ACQUISITION_TIMEOUT_SECONDS: ${FF_ASSET_ACQUISITION_TIMEOUT_SECONDS:-600}
    secrets: [database_url, redis_url, s3_access_key, s3_secret_key]
    tmpfs: ["/tmp:size=256m,mode=1777"]
    volumes:
      - type: bind
        source: ${FF_LEGACY_MEDIA_DIR:-../../var/legacy-media}
        target: /opt/framefactory/legacy-media
        read_only: true
    networks: [backend, egress]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    command:
      - /bin/sh
      - -ec
      - |
        export FRAMEFACTORY_DATABASE_URL="$$(cat /run/secrets/database_url)"
        export FRAMEFACTORY_REDIS_URL="$$(cat /run/secrets/redis_url)"
        exec framefactory-worker run
    cpus: 2.0
    mem_limit: 2g

  postgres:
    <<: *hardened
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_DB: framefactory
      POSTGRES_USER: framefactory
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [postgres_password]
    tmpfs:
      - "/tmp:size=128m,mode=1777"
      - "/var/run/postgresql:size=16m,uid=999,gid=999,mode=0770"
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U framefactory -d framefactory"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    cpus: 2.0
    mem_limit: 4g

  redis:
    <<: *hardened
    image: redis:7.4.2-alpine
    command: ["/bin/sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets: [redis_password]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    volumes: [redis_data:/data:rw]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    cpus: 1.0
    mem_limit: 1g

  s3:
    <<: *hardened
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: [server, /data, "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/s3_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_secret_key
    secrets: [s3_access_key, s3_secret_key]
    tmpfs: ["/tmp:size=128m,mode=1777"]
    volumes: [s3_data:/data:rw]
    networks: [backend]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:9000/minio/health/ready]
      interval: 10s
      timeout: 5s
      retries: 10
    cpus: 2.0
    mem_limit: 4g

networks:
  ingress: {}
  backend: {internal: true}
  egress: {}
volumes:
  postgres_data: {}
  redis_data: {}
  s3_data: {}
secrets:
  postgres_password: {file: "${FF_POSTGRES_PASSWORD_FILE:?required}"}
  database_url: {file: "${FF_DATABASE_URL_FILE:?required}"}
  redis_password: {file: "${FF_REDIS_PASSWORD_FILE:?required}"}
  redis_url: {file: "${FF_REDIS_URL_FILE:?required}"}
  s3_access_key: {file: "${FF_S3_ACCESS_KEY_FILE:?required}"}
  s3_secret_key: {file: "${FF_S3_SECRET_KEY_FILE:?required}"}
