[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "framefactory-worker"
version = "0.1.0"
description = "FrameFactory worker execution kernel"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35,<2",
  "edge-tts>=7.2.8,<8",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=6.16.1,<7",
  "redis>=5,<7",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.26,<5",
  "Pillow>=12.3,<13",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<1",
]
browser-capture = [
  "playwright==1.62.0",
]

[project.scripts]
framefactory-worker = "framefactory.worker.__main__:main"
framefactory-semantic-timeline-benchmark = "framefactory.worker.semantic_timeline_benchmark:main"
framefactory-document-hybrid-pilot = "framefactory.worker.document_hybrid.pilot:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["framefactory*"]
