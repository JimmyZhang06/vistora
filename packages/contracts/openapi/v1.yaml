      properties:
        decision: { type: string, enum: [approve, reject, revise] }
        reason: { type: [string, 'null'], maxLength: 4000 }
        issue_codes:
          type: array
          maxItems: 20
          items: { type: string, pattern: '^[a-z0-9]+(?:[._-][a-z0-9]+)*$', maxLength: 80 }
        expected_revision: { type: [integer, 'null'], minimum: 0 }
