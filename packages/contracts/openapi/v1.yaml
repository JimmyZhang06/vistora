        workspace_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        user_agent: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
    ApiKey:
      type: object
      additionalProperties: false
      required: [id, workspace_id, name, key_prefix, scopes, created_at, expires_at, last_used_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        key_prefix: { type: string }
        scopes:
          type: array
          items: { type: string, enum: ['account:read', 'skills:read', 'skills:write', 'runs:read', 'runs:write', 'url_capture:read', 'url_capture:write', 'url_capture:review'] }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
    ApiKeyCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scopes:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          default: [skills:read]
          items: { type: string, enum: ['account:read', 'skills:read', 'skills:write', 'runs:read', 'runs:write', 'url_capture:read', 'url_capture:write', 'url_capture:review'] }
        expires_at: { type: [string, 'null'], format: date-time }
    ApiKeyCreated:
      type: object
      additionalProperties: false
      required: [key, api_key]
      properties:
        key: { $ref: '#/components/schemas/ApiKey' }
        api_key:
          type: string
          description: Returned once and never persisted in plaintext.
