        - queue_name
        - required_capabilities
        - input_snapshot
        - output_summary
        - output_artifacts
        - dependencies
        - attempt
        - maximum_attempts
        - error
        - review_required
        - review
        - lease_owner
        - lease_expires_at
        - heartbeat_at
        - next_attempt_at
        - cancellation_requested_at
        - created_at
        - started_at
        - finished_at
        - updated_at
        - revision
      properties:
        schema_version: { type: string, const: 1.0.0 }
        id:
          type: string
          pattern: '^[0-9a-fA-F-]{36}:[a-z][a-z0-9_]{0,63}$'
        workspace_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        node_key: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        operation: { type: string, pattern: '^[a-z][a-z0-9_.-]{0,127}$' }
        status:
          type: string
          enum: [queued, running, awaiting_review, retrying, succeeded, failed, cancelled]
        queue_name: { type: string }
        required_capabilities: { type: array, items: { type: string } }
        input_snapshot: {}
        output_summary: { type: [object, array, string, number, boolean, 'null'] }
        output_artifacts: { type: array, items: { type: object } }
