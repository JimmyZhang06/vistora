          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [asset_id, code, message]
            properties:
              asset_id: { type: string, format: uuid }
              code: { type: string }
              message: { type: string }
              current_revision: { type: integer, minimum: 1 }
    AccountCapabilities:
      type: object
      additionalProperties: false
      required: [profile, creation_preferences, sessions, api_keys, two_factor_authentication]
      properties:
        profile: { type: string, const: available }
        creation_preferences: { type: string, const: available }
        sessions:
          type: string
          const: not_recorded
          description: Management endpoints exist, but the current single-user context does not create login sessions.
        api_keys:
          type: string
          const: management_only
          description: Key creation, listing and revocation exist; request authentication and scope enforcement are not connected yet.
        two_factor_authentication: { type: string, const: unavailable }
    AccountProfile:
      type: object
      additionalProperties: false
      required: [user_id, workspace_id, email, display_name, avatar_url, locale, timezone, revision, updated_at]
      properties:
        user_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string, minLength: 1, maxLength: 160 }
        avatar_url: { type: [string, 'null'], maxLength: 2048 }
        locale: { type: string, pattern: '^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$' }
        timezone: { type: string, minLength: 1, maxLength: 100 }
        revision: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }
    AccountProfileUpdate:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 160 }
        avatar_url: { type: [string, 'null'], maxLength: 2048 }
        locale: { type: string, pattern: '^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$', default: zh-CN }
        timezone: { type: string, minLength: 1, maxLength: 100, default: Asia/Shanghai }
    CreationPreferences:
      type: object
      additionalProperties: false
      required: [user_id, workspace_id, default_language, default_aspect_ratio, default_duration_seconds, default_visibility, auto_quality_check, revision, updated_at]
      properties:
        user_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        default_language: { type: string }
        default_aspect_ratio: { type: string, enum: ['16:9', '9:16', '1:1', '4:3'] }
        default_duration_seconds: { type: integer, minimum: 15, maximum: 3600 }
        default_visibility: { type: string, enum: [private, workspace] }
        auto_quality_check: { type: boolean }
        revision: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }
    CreationPreferencesUpdate:
      type: object
      additionalProperties: false
      properties:
        default_language: { type: string, default: zh-CN }
        default_aspect_ratio: { type: string, enum: ['16:9', '9:16', '1:1', '4:3'], default: '16:9' }
        default_duration_seconds: { type: integer, minimum: 15, maximum: 3600, default: 180 }
        default_visibility: { type: string, enum: [private, workspace], default: private }
        auto_quality_check: { type: boolean, default: true }
    AccountSession:
      type: object
      additionalProperties: false
      required: [id, workspace_id, user_id, user_agent, created_at, expires_at, last_seen_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        user_agent: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
    ApiKey:
      type: object
      additionalProperties: false
      required: [id, workspace_id, name, key_prefix, scopes, created_at, expires_at, last_used_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        key_prefix: { type: string }
        scopes:
          type: array
          items: { type: string, enum: ['account:read', 'skills:read', 'skills:write', 'runs:read', 'runs:write'] }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
    ApiKeyCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scopes:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          default: [skills:read]
          items: { type: string, enum: ['account:read', 'skills:read', 'skills:write', 'runs:read', 'runs:write'] }
        expires_at: { type: [string, 'null'], format: date-time }
    ApiKeyCreated:
      type: object
      additionalProperties: false
      required: [key, api_key]
      properties:
        key: { $ref: '#/components/schemas/ApiKey' }
        api_key:
          type: string
          description: Returned once and never persisted in plaintext.
