        lease_expires_at: { type: [string, 'null'], format: date-time }
        heartbeat_at: { type: [string, 'null'], format: date-time }
        next_attempt_at: { type: [string, 'null'], format: date-time }
        cancellation_requested_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: string, format: date-time }
        revision: { type: integer, minimum: 0 }
