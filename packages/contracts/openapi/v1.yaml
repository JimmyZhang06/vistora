    delete:
      tags: [Skills]
      operationId: deleteSkillVersion
      summary: Delete an unreferenced draft
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Draft deleted
        default:
          $ref: '#/components/responses/Error'
  /v1/skill-versions/{skill_version_id}/validate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/SkillVersionId'
    post:
      tags: [Skills]
      operationId: validateSkillVersion
      summary: Validate a draft and transition it to ready or rejected
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          $ref: '#/components/responses/ValidationReport'
        default:
          $ref: '#/components/responses/Error'
  /v1/skill-versions/{skill_version_id}/publish:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/SkillVersionId'
    post:
      tags: [Skills]
      operationId: publishSkillVersion
      summary: Publish an immutable user-owned SkillVersion
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        $ref: '#/components/requestBodies/PublishSkillVersion'
      responses:
        '200':
          $ref: '#/components/responses/SkillVersion'
        default:
          $ref: '#/components/responses/Error'
  /v1/skill-test-executions:
    get:
      tags: [Skills]
      operationId: listSkillTestExecutions
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/SkillTestExecutionList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Skills]
      operationId: createSkillTestExecution
      summary: Execute the stage-one deterministic local comparison evaluator
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/SkillTestExecutionCreate'
      responses:
        '201':
          $ref: '#/components/responses/SkillTestExecution'
        default:
          $ref: '#/components/responses/Error'
  /v1/skill-test-executions/{execution_id}:
    get:
      tags: [Skills]
      operationId: getSkillTestExecution
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - name: execution_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          $ref: '#/components/responses/SkillTestExecution'
        default:
          $ref: '#/components/responses/Error'
  /v1/generation-batches:
    get:
      tags: [Batches]
      operationId: listGenerationBatches
      summary: List durable generation batches in the active workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Generation batch page
          content:
            application/json:
              schema: { type: object }
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Batches]
      operationId: createGenerationBatch
      summary: Atomically create up to 5000 normal Runs under one batch
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerationBatchCreate' }
      responses:
        '202':
          description: Durable batch accepted for dispatch
          content:
            application/json:
              schema: { type: object }
        default:
          $ref: '#/components/responses/Error'
  /v1/generation-batches/{batch_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - name: batch_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Batches]
      operationId: getGenerationBatch
      responses:
        '200':
          description: Aggregated generation batch
          content:
            application/json:
              schema: { type: object }
        default:
          $ref: '#/components/responses/Error'
  /v1/generation-batches/{batch_id}/items:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - name: batch_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Batches]
      operationId: listGenerationBatchItems
      summary: Page and filter Run-backed items without loading the whole batch
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string, maxLength: 300 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Filtered batch item page
          content:
            application/json:
              schema: { type: object }
        default:
          $ref: '#/components/responses/Error'
  /v1/generation-batches/{batch_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - name: batch_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Batches]
      operationId: cancelGenerationBatch
      summary: Idempotently request cancellation for every non-terminal Run in a batch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Cancellation requests have been persisted
          content:
            application/json:
              schema: { type: object }
        default:
          $ref: '#/components/responses/Error'
  /v1/generation-batches/{batch_id}/retry-failed:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - name: batch_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Batches]
      operationId: retryFailedGenerationBatch
      summary: Create a new immutable batch from the failed items in a source batch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '202':
          description: New retry batch accepted for dispatch
          content:
            application/json:
              schema: { type: object }
        default:
          $ref: '#/components/responses/Error'
  /v1/runs:
    get:
      tags: [Runs]
      operationId: listRuns
      summary: List runs in the active workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/RunList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Runs]
      operationId: createRun
      summary: Create an idempotent run with an immutable composition snapshot
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/RunCreate'
      responses:
        '201':
          $ref: '#/components/responses/Run'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/estimate:
    post:
      tags: [Runs]
      operationId: estimateRun
      summary: Validate an immutable run composition against current Worker capabilities
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
      requestBody:
        $ref: '#/components/requestBodies/RunCreate'
      responses:
        '200':
          description: Run estimate and executable capability gaps
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [cost, duration_seconds, capability_gaps, capabilities_known]
                properties:
                  cost:
                    type: object
                    additionalProperties: false
                    required: [amount, currency]
                    properties:
                      amount: { type: number, minimum: 0 }
                      currency: { type: string, enum: [CNY, USD] }
                  duration_seconds: { type: integer, minimum: 1 }
                  capability_gaps:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [capability, resource, message]
                      properties:
                        capability: { type: string }
                        resource: { type: string }
                        message: { type: string }
                  capabilities_known: { type: boolean }
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRun
      summary: Get an authorized run
      responses:
        '200':
          $ref: '#/components/responses/Run'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/{run_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: cancelRun
      summary: Request cancellation of a run
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Run'
        default:
          $ref: '#/components/responses/Error'
  /v1/steps:
    get:
      tags: [Steps]
      operationId: listSteps
      summary: List recoverable steps
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - name: run_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/StepList'
        default:
          $ref: '#/components/responses/Error'
  /v1/steps/{step_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/StepId'
    get:
      tags: [Steps]
      operationId: getStep
      summary: Get a recoverable step
      responses:
        '200':
          $ref: '#/components/responses/Step'
        default:
          $ref: '#/components/responses/Error'
  /v1/steps/{step_id}/retry:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/StepId'
    post:
      tags: [Steps]
      operationId: retryStep
      summary: Request an idempotent retry for an eligible step
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Step'
        default:
          $ref: '#/components/responses/Error'
  /v1/steps/{step_id}/review:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/StepId'
    post:
      tags: [Steps]
      operationId: reviewStep
      summary: Approve or reject a step waiting at a human review gate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepReviewRequest' }
      responses:
        '202':
          $ref: '#/components/responses/Step'
        default:
          $ref: '#/components/responses/Error'
  /v1/artifacts:
    get:
      tags: [Artifacts]
      operationId: listArtifacts
      summary: List artifact metadata for an authorized run
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - name: run_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/ArtifactList'
        default:
          $ref: '#/components/responses/Error'
  /v1/artifacts/{artifact_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [Artifacts]
      operationId: getArtifact
      summary: Get artifact metadata; content access uses a separate signed URL flow
      responses:
        '200':
          $ref: '#/components/responses/Artifact'
        default:
          $ref: '#/components/responses/Error'
  /v1/artifacts/{artifact_id}/content:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [Artifacts]
      operationId: getArtifactContent
      summary: Read a small text artifact inline or redirect to a signed download URL
      parameters:
        - name: inline
          in: query
          required: false
          description: Return integrity-checked JSON or text content directly for browser preview.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Inline JSON or text artifact content
          headers:
            X-Content-SHA256:
              schema: { type: string, pattern: '^[a-f0-9]{64}$' }
          content:
            application/json:
              schema: {}
            text/plain:
              schema: { type: string }
        '307':
          description: Temporary redirect to private object storage
          headers:
            Location:
              schema: { type: string, format: uri }
        default:
          $ref: '#/components/responses/Error'
  /v1/events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List durable events for an authorized run
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - name: run_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: after_sequence
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/EventList'
        default:
          $ref: '#/components/responses/Error'
  /v1/events/{event_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get a durable event
      responses:
        '200':
          $ref: '#/components/responses/Event'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    workspaceApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    WorkspaceHeader:
      name: X-Workspace-Id
      in: header
      required: false
      description: >-
        Reserved workspace boundary. In the current single-workspace runtime it
        may be omitted and resolves to the configured workspace. When supplied,
        it is ignored rather than selecting a tenant.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: '^[A-Za-z0-9._:-]+$'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted or unquoted numeric revision returned in ETag.
      schema:
        type: string
        minLength: 1
        maxLength: 32
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
    ChannelSearch:
      name: search
      in: query
      required: false
      description: Case-insensitive substring search across Channel name, slug, description, and handle.
      schema:
        type: string
        minLength: 1
        maxLength: 160
    ChannelPlatform:
      name: platform
      in: query
      required: false
      description: Case-insensitive exact platform filter; Channel platform values are stored in lowercase.
      schema:
        type: string
        minLength: 1
        maxLength: 80
    ChannelStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, paused, archived]
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChannelId:
      name: channel_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SkillId:
      name: skill_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SkillVersionId:
      name: skill_version_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetLibraryId:
      name: library_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetId:
      name: asset_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RenderPresetId:
      name: render_preset_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PipelineId:
      name: pipeline_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebpageVideoRunId:
      name: webpage_video_run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StepId:
      name: step_id
      in: path
      required: true
      description: Stable worker step id composed from the Run id and pipeline node key.
      schema:
        type: string
        minLength: 38
        maxLength: 101
        pattern: '^[0-9a-fA-F-]{36}:[a-z][a-z0-9_]{0,63}$'
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: event_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApiKeyId:
      name: key_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    DocumentSourceCreate:
      type: object
      additionalProperties: false
      required: [filename, content_type, byte_size, sha256, rights_confirmed]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255, pattern: '^[^/\\]+\.[Pp][Dd][Ff]$' }
        content_type: { type: string, const: application/pdf }
        byte_size: { type: integer, minimum: 1, maximum: 209715200 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        rights_confirmed: { type: boolean, const: true }
    DocumentSourceComplete:
      type: object
      additionalProperties: false
      required: [object_key, sha256, content_type]
      properties:
        object_key: { type: string, minLength: 1, maxLength: 1024 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        content_type: { type: string, const: application/pdf }
    DocumentSource:
      type: object
      required: [schema_version, id, workspace_id, filename, media_type, byte_size, content_hash, rights_confirmed, status, validation, revision, upload_expires_at, legal_hold, created_at, updated_at]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        filename: { type: string }
        media_type: { type: string, const: application/pdf }
        byte_size: { type: integer, minimum: 1, maximum: 209715200 }
        content_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        rights_confirmed: { type: boolean, const: true }
        status: { type: string, enum: [uploading, uploaded, rejected, deletion_pending, purging, purged] }
        validation: { type: object }
        revision: { type: integer, minimum: 1 }
        created_by: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
        uploaded_at: { type: [string, 'null'], format: date-time }
        upload_expires_at: { type: string, format: date-time, readOnly: true }
        retention_until: { type: [string, 'null'], format: date-time }
        legal_hold: { type: boolean }
        legal_hold_reason: { type: [string, 'null'], maxLength: 1000 }
        legal_hold_set_by: { type: [string, 'null'], format: uuid }
        legal_hold_set_at: { type: [string, 'null'], format: date-time }
        deletion_requested_at: { type: [string, 'null'], format: date-time }
        purged_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: string, format: date-time }
        object_key: { type: string, writeOnly: true }
        upload: { type: object, writeOnly: true }
    DocumentRetentionUpdate:
      type: object
      additionalProperties: false
      required: [retention_until, reason]
      properties:
        retention_until: { type: [string, 'null'], format: date-time }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    DocumentLegalHoldUpdate:
      type: object
      additionalProperties: false
      required: [active, reason]
      properties:
        active: { type: boolean }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    DocumentPurgeCreate:
      type: object
      additionalProperties: false
      required: [reason, delete_derived, confirmation]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
        delete_derived: { type: boolean, const: true }
        confirmation: { type: string, const: DELETE }
    DocumentPurgeRequest:
      type: object
      additionalProperties: false
      required: [schema_version, id, workspace_id, source_id, status, reason, delete_derived, attempt_count, max_attempts, next_attempt_at, created_at, updated_at]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        source_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, purging, retrying, blocked, failed, succeeded] }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        delete_derived: { type: boolean, const: true }
        requested_by: { type: [string, 'null'], format: uuid }
        attempt_count: { type: integer, minimum: 0 }
        max_attempts: { type: integer, minimum: 1 }
        next_attempt_at: { type: string, format: date-time }
        last_error: { type: [object, 'null'] }
        source_object_deleted_at: { type: [string, 'null'], format: date-time }
        derived_objects_deleted_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: string, format: date-time }
    DocumentVideoRunCreate:
      type: object
      additionalProperties: false
      required: [source_id, topic]
      properties:
        source_id: { type: string, format: uuid }
        topic: { type: string, minLength: 1, maxLength: 1600 }
        duration_seconds: { type: integer, minimum: 30, maximum: 600, default: 120 }
        aspect_ratio: { type: string, enum: ['16:9', '9:16', '1:1'], default: '16:9' }
        generated_background_enabled: { type: boolean, default: true }
    FullAiVideoSpec:
      type: object
      additionalProperties: false
      required: [brief, direction, aspect_ratio, duration_seconds, variants_per_scene, continuity, ai_disclosure]
      properties:
        brief: { type: string, minLength: 1, maxLength: 1600 }
        direction: { type: string, enum: [cinematic, graphic, illustrated] }
        aspect_ratio: { type: string, enum: ['9:16', '16:9'] }
        duration_seconds: { type: integer, enum: [15, 30, 45, 60] }
        variants_per_scene: { type: integer, enum: [1, 2, 3] }
        continuity: { type: boolean }
        ai_disclosure: { type: boolean }
    FullAiRunCreate:
      type: object
      additionalProperties: false
      required: [brief, direction, aspect_ratio, duration_seconds, variants_per_scene, continuity, ai_disclosure, estimate_fingerprint, max_cost_minor, currency]
      properties:
        brief: { type: string, minLength: 1, maxLength: 1600 }
        direction: { type: string, enum: [cinematic, graphic, illustrated] }
        aspect_ratio: { type: string, enum: ['9:16', '16:9'] }
