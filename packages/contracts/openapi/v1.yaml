openapi: 3.1.0
info:
  title: FrameFactory Control API
  version: 1.0.0
  summary: Single-workspace content production API with a reserved workspace boundary
  description: >-
    Version 1 of the FrameFactory control-plane contract. The current product
    runs in one configured personal workspace. Workspace identifiers remain in
    resource contracts so a future multi-workspace mode does not require a
    breaking schema change, but clients do not need to choose a workspace.
    System-published and user-published skills use the same Skill and
    SkillVersion schemas, storage, and endpoints.
servers:
  - url: https://api.framefactory.example
    description: Example deployment
security:
  - bearerAuth: []
  - workspaceApiKey: []
tags:
  - name: Context
  - name: Account
  - name: Users
  - name: Workspaces
  - name: Channels
  - name: Skills
  - name: Asset libraries
  - name: Render presets
  - name: Pipelines
  - name: Runs
  - name: Steps
  - name: Artifacts
  - name: Events
paths:
  /v1/context:
    get:
      tags: [Context]
      operationId: getCurrentContext
      summary: Resolve the installation's current single-workspace context
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
      responses:
        '200':
          $ref: '#/components/responses/CurrentContext'
        default:
          $ref: '#/components/responses/Error'
  /v1/account/capabilities:
    get:
      tags: [Account]
      operationId: getAccountCapabilities
      summary: List account capabilities available in this release
      responses:
        '200':
          description: Account capability availability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountCapabilities' }
        default:
          $ref: '#/components/responses/Error'
  /v1/account/profile:
    get:
      tags: [Account]
      operationId: getAccountProfile
      summary: Get the current user's profile
      responses:
        '200':
          description: Current account profile
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountProfile' }
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [Account]
      operationId: replaceAccountProfile
      summary: Replace mutable fields in the current user's profile
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountProfileUpdate' }
      responses:
        '200':
          description: Updated account profile
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountProfile' }
        default:
          $ref: '#/components/responses/Error'
  /v1/account/creation-preferences:
    get:
      tags: [Account]
      operationId: getCreationPreferences
      summary: Get defaults used by the creation workflow
      responses:
        '200':
          description: Creation preferences
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreationPreferences' }
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [Account]
      operationId: replaceCreationPreferences
      summary: Replace defaults used by the creation workflow
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreationPreferencesUpdate' }
      responses:
        '200':
          description: Updated creation preferences
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreationPreferences' }
        default:
          $ref: '#/components/responses/Error'
  /v1/account/sessions:
    get:
      tags: [Account]
      operationId: listAccountSessions
      summary: List sessions belonging to the current user
      responses:
        '200':
          description: Account sessions; token and IP hashes are never returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccountSession' }
        default:
          $ref: '#/components/responses/Error'
  /v1/account/sessions/{session_id}:
    delete:
      tags: [Account]
      operationId: revokeAccountSession
      summary: Revoke one account session
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204': { description: Session revoked }
        default:
          $ref: '#/components/responses/Error'
  /v1/account/api-keys:
    get:
      tags: [Account]
      operationId: listAccountApiKeys
      summary: List API key metadata without secrets or hashes
      responses:
        '200':
          description: API key metadata
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKey' }
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Account]
      operationId: createAccountApiKey
      summary: Create an API key and return its plaintext exactly once
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyCreate' }
      responses:
        '201':
          description: API key metadata and one-time plaintext
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyCreated' }
        default:
          $ref: '#/components/responses/Error'
  /v1/account/api-keys/{key_id}:
    delete:
      tags: [Account]
      operationId: revokeAccountApiKey
      summary: Revoke one API key
      parameters:
        - $ref: '#/components/parameters/ApiKeyId'
      responses:
        '204': { description: API key revoked }
        default:
          $ref: '#/components/responses/Error'
  /v1/account/two-factor:
    post:
      tags: [Account]
      operationId: configureTwoFactor
      summary: Report that two-factor authentication is unavailable in this release
      responses:
        '501':
          $ref: '#/components/responses/Error'
  /v1/users:
    get:
      tags: [Reserved]
      operationId: listUsersReserved
      summary: Reserved user directory interface for a future release
      responses:
        '501': { $ref: '#/components/responses/Error' }
  /v1/users/{user_id}:
    get:
      tags: [Reserved]
      operationId: getUserReserved
      summary: Reserved user detail interface for a future release
      responses:
        '501': { $ref: '#/components/responses/Error' }
  /v1/workspaces:
    get:
      tags: [Reserved]
      operationId: listWorkspacesReserved
      summary: Reserved workspace list interface for a future release
      responses:
        '501': { $ref: '#/components/responses/Error' }
    post:
      tags: [Reserved]
      operationId: createWorkspaceReserved
      summary: Reserved workspace creation interface for a future release
      responses:
        '501': { $ref: '#/components/responses/Error' }
  /v1/workspaces/{workspace_id}:
    get:
      tags: [Reserved]
      operationId: getWorkspaceReserved
      summary: Reserved workspace detail interface for a future release
      responses:
        '501': { $ref: '#/components/responses/Error' }
  /v1/channels:
    get:
      tags: [Channels]
      operationId: listChannels
      summary: List publishing Channels in the configured workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ChannelSearch'
        - $ref: '#/components/parameters/ChannelPlatform'
        - $ref: '#/components/parameters/ChannelStatus'
      responses:
        '200': { $ref: '#/components/responses/ChannelList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Channels]
      operationId: createChannel
      summary: Create a Channel with durable default composition references
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ChannelWrite'
      responses:
        '201': { $ref: '#/components/responses/Channel' }
        default: { $ref: '#/components/responses/Error' }
  /v1/channels/{channel_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [Channels]
      operationId: getChannel
      summary: Get a Channel and its current default composition
      responses:
        '200': { $ref: '#/components/responses/Channel' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Channels]
      operationId: replaceChannel
      summary: Replace a Channel using its numeric ETag revision
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        $ref: '#/components/requestBodies/ChannelWrite'
      responses:
        '200': { $ref: '#/components/responses/Channel' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Channels]
      operationId: archiveChannel
      summary: Archive a Channel using its numeric ETag revision
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Channel archived }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/asset-libraries:
    get:
      tags: [Assets]
      operationId: listAssetLibraries
      summary: List durable asset libraries in the default workspace
      responses:
        '200': { description: Asset library page }
    post:
      tags: [Assets]
      operationId: createAssetLibrary
      summary: Create an asset library
      responses:
        '201': { description: Asset library created }
  /v1/asset-libraries/{library_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/AssetLibraryId'
    get:
      tags: [Assets]
      operationId: getAssetLibrary
      summary: Get an asset library and its readiness counts
      responses:
        '200': { description: Asset library }
        default: { $ref: '#/components/responses/Error' }
  /v1/asset-libraries/{library_id}/assets:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/AssetLibraryId'
    get:
      tags: [Assets]
      operationId: listLibraryAssets
      summary: List workspace-scoped assets using a filter-bound keyset cursor
      x-required-scopes: [assets:read]
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/AssetStatus' }
        - name: kind
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/AssetKind' }
        - name: copyright_status
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/CopyrightStatus' }
        - name: analysis_status
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/AnalysisStatus' }
        - name: tag
          in: query
          schema: { type: array, items: { type: string, maxLength: 100 } }
        - name: q
          in: query
          schema: { type: string, maxLength: 300 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/AssetPage' }
        default: { $ref: '#/components/responses/Error' }
  /v1/asset-libraries/{library_id}/import-jobs:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/AssetLibraryId'
    get:
      tags: [Assets]
      operationId: listAssetImportJobs
      summary: List asynchronous import jobs for an asset library
      x-required-scopes: [assets:read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/ResourcePage' }
        default: { $ref: '#/components/responses/Error' }
  /v1/assets/batch-review:
    post:
      tags: [Assets]
      operationId: batchReviewAssets
      summary: Apply a review transition to at most 100 revision-fenced assets
      x-required-scopes: [assets:review]
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetBatchReview' }
      responses:
        '200': { $ref: '#/components/responses/BatchAssetResult' }
        default: { $ref: '#/components/responses/Error' }
  /v1/assets/batch-tags:
    post:
      tags: [Assets]
      operationId: batchTagAssets
      summary: Add or remove manual tags from at most 100 revision-fenced assets
      x-required-scopes: [assets:write]
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetBatchTags' }
      responses:
        '200': { $ref: '#/components/responses/BatchAssetResult' }
        default: { $ref: '#/components/responses/Error' }
  /v1/assets/batch-reanalyze:
    post:
      tags: [Assets]
      operationId: batchReanalyzeAssets
      summary: Queue reanalysis for at most 100 revision-fenced assets
      x-required-scopes: [assets:write]
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetBatchReanalysis' }
      responses:
        '202': { $ref: '#/components/responses/BatchAssetResult' }
        default: { $ref: '#/components/responses/Error' }
  /v1/assets/{asset_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/AssetId'
    get:
      tags: [Assets]
      operationId: getAsset
      summary: Get workspace-scoped asset metadata without storage credentials or object keys
      x-required-scopes: [assets:read]
      responses:
        '200': { $ref: '#/components/responses/Asset' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Assets]
      operationId: updateAssetMetadata
      summary: Safely update mutable metadata using optimistic concurrency
      x-required-scopes: [assets:write]
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetMetadataPatch' }
      responses:
        '200': { $ref: '#/components/responses/Asset' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Assets]
      operationId: softDeleteAsset
      summary: Soft-delete asset metadata without deleting its object
      x-required-scopes: [assets:write]
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { $ref: '#/components/responses/Asset' }
        default: { $ref: '#/components/responses/Error' }
  /v1/assets/{asset_id}/status-transitions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/AssetId'
    post:
      tags: [Assets]
      operationId: transitionAssetStatus
      summary: Apply an audited status transition; ready always rechecks every safety gate
      x-required-scopes: [assets:review]
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetStatusTransition' }
      responses:
        '200': { $ref: '#/components/responses/Asset' }
        default: { $ref: '#/components/responses/Error' }
  /v1/assets/{asset_id}/restore:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/AssetId'
    post:
      tags: [Assets]
      operationId: restoreAsset
      summary: Restore a soft-deleted asset and re-evaluate ready gates when needed
      x-required-scopes: [assets:write]
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { $ref: '#/components/responses/Asset' }
        default: { $ref: '#/components/responses/Error' }
  /v1/assets/{asset_id}/segments:
    get:
      tags: [Assets]
      operationId: listAssetSegments
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses: { '200': { $ref: '#/components/responses/ResourcePage' }, default: { $ref: '#/components/responses/Error' } }
  /v1/assets/{asset_id}/analyses:
    get:
      tags: [Assets]
      operationId: listAssetAnalyses
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses: { '200': { $ref: '#/components/responses/ResourcePage' }, default: { $ref: '#/components/responses/Error' } }
  /v1/assets/{asset_id}/sources:
    get:
      tags: [Assets]
      operationId: listAssetSources
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses: { '200': { $ref: '#/components/responses/ResourcePage' }, default: { $ref: '#/components/responses/Error' } }
  /v1/assets/{asset_id}/rights-evidence:
    get:
      tags: [Assets]
      operationId: listAssetRightsEvidence
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses: { '200': { $ref: '#/components/responses/ResourcePage' }, default: { $ref: '#/components/responses/Error' } }
  /v1/assets/{asset_id}/usage-records:
    get:
      tags: [Assets]
      operationId: listAssetUsageRecords
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses: { '200': { $ref: '#/components/responses/ResourcePage' }, default: { $ref: '#/components/responses/Error' } }
  /v1/assets/{asset_id}/analysis-jobs:
    get:
      tags: [Assets]
      operationId: listAssetAnalysisJobs
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses: { '200': { $ref: '#/components/responses/ResourcePage' }, default: { $ref: '#/components/responses/Error' } }
  /v1/assets/{asset_id}/audit-events:
    get:
      tags: [Assets]
      operationId: listAssetAuditEvents
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses: { '200': { $ref: '#/components/responses/ResourcePage' }, default: { $ref: '#/components/responses/Error' } }
  /v1/assets/{asset_id}/reanalyze:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/AssetId'
    post:
      tags: [Assets]
      operationId: requestAssetReanalysis
      summary: Persist and enqueue a reanalysis job without recomputing in HTTP
      x-required-scopes: [assets:write]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetReanalysisRequest' }
      responses:
        '202': { description: Reanalysis job queued }
        default: { $ref: '#/components/responses/Error' }
  /v1/assets/{asset_id}/downloads/{variant}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/AssetId'
      - name: variant
        in: path
        required: true
        schema: { type: string, enum: [poster, preview, original] }
    get:
      tags: [Assets]
      operationId: createAssetDownload
      summary: Create a short-lived signed download using only the persisted object descriptor
      x-required-scopes: [assets:download]
      parameters:
        - name: expires_in
          in: query
          schema: { type: integer, minimum: 60, maximum: 1800, default: 900 }
      responses:
        '200': { description: Short-lived signed request }
        default: { $ref: '#/components/responses/Error' }
  /v1/asset-uploads:
    post:
      tags: [Assets]
      operationId: createAssetUpload
      summary: Initiate a checksum-bound direct media upload
      responses:
        '201': { description: Presigned upload prepared }
  /v1/asset-uploads/{asset_id}/complete:
    post:
      tags: [Assets]
      operationId: completeAssetUpload
      summary: Verify an uploaded object and make the asset searchable
      responses:
        '200': { description: Asset ready }
  /v1/asset-imports:
    post:
      tags: [Assets]
      operationId: importRemoteAsset
      summary: Download a user-authorized public video and store it in an asset library
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [library_id, source_url, copyright_status, rights_confirmed]
              properties:
                library_id: { type: string, format: uuid }
                source_url: { type: string, format: uri, maxLength: 2048 }
                title: { type: [string, 'null'], maxLength: 300 }
                description: { type: string, maxLength: 2000, default: '' }
                copyright_status:
                  type: string
                  enum: [owned, licensed, public_domain]
                tags:
                  type: array
                  maxItems: 64
                  items: { type: string, maxLength: 100 }
                rights_confirmed: { type: boolean, const: true }
      responses:
        '201': { description: Remote asset downloaded and stored }
        default:
          $ref: '#/components/responses/Error'
  /v1/asset-acquisitions:
    post:
      tags: [Assets]
      operationId: acquireAssetsForTopics
      summary: Search approved remote providers and import rights-confirmed candidates
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [library_id, queries, sources, rights_confirmed]
              properties:
                library_id: { type: string, format: uuid }
                queries:
                  type: array
                  minItems: 1
                  maxItems: 12
                  items: { type: string, minLength: 1, maxLength: 500 }
                sources:
                  type: array
                  minItems: 1
                  maxItems: 2
                  uniqueItems: true
                  items: { type: string, enum: [youtube, bilibili, wikimedia] }
                max_assets: { type: integer, minimum: 1, maximum: 6, default: 3 }
                copyright_status: { type: string, enum: [licensed, public_domain], default: licensed }
                rights_confirmed: { type: boolean, const: true }
                run_id: { type: [string, 'null'], format: uuid }
                step_id: { type: [string, 'null'], maxLength: 255 }
      responses:
        '201': { description: Acquisition summary }
        default: { $ref: '#/components/responses/Error' }
  /v1/render-presets:
    get:
      tags: [Reserved]
      operationId: listRenderPresetsReserved
      summary: Reserved render preset list interface for a future release
      responses:
        '501': { $ref: '#/components/responses/Error' }
    post:
      tags: [Reserved]
      operationId: createRenderPresetReserved
      summary: Reserved render preset creation interface for a future release
      responses:
        '501': { $ref: '#/components/responses/Error' }
  /v1/render-presets/{render_preset_id}:
    get:
      tags: [Reserved]
      operationId: getRenderPresetReserved
      summary: Reserved render preset detail interface for a future release
      responses:
        '501': { $ref: '#/components/responses/Error' }
  /v1/pipelines:
    get:
      tags: [Reserved]
      operationId: listPipelinesReserved
      summary: Reserved pipeline authoring interface for a future release
      responses:
        '501': { $ref: '#/components/responses/Error' }
    post:
      tags: [Reserved]
      operationId: createPipelineReserved
      summary: Reserved pipeline creation interface for a future release
      responses:
        '501': { $ref: '#/components/responses/Error' }
  /v1/pipelines/{pipeline_id}:
    get:
      tags: [Reserved]
      operationId: getPipelineReserved
      summary: Reserved pipeline detail interface for a future release
      responses:
        '501': { $ref: '#/components/responses/Error' }
  /v1/skills/{skill_id}/fork:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/SkillId'
    post:
      tags: [Skills]
      operationId: forkSkill
      summary: Fork an official or user-visible Skill into the current workspace
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ForkSkill'
      responses:
        '201':
          $ref: '#/components/responses/ForkSkill'
        default:
          $ref: '#/components/responses/Error'
  /v1/skills:
    get:
      tags: [Skills]
      operationId: listSkills
      summary: List authorized user and system-published skills
      description: System and user skills are returned as the same Skill resource.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/SkillList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Skills]
      operationId: createSkill
      summary: Create a skill in the active workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/SkillCreate'
      responses:
        '201':
          $ref: '#/components/responses/Skill'
        default:
          $ref: '#/components/responses/Error'
  /v1/skills/{skill_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/SkillId'
    get:
      tags: [Skills]
      operationId: getSkill
      summary: Get an authorized skill
      responses:
        '200':
          $ref: '#/components/responses/Skill'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [Skills]
      operationId: replaceSkill
      summary: Replace mutable skill identity metadata
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        $ref: '#/components/requestBodies/SkillCreate'
      responses:
        '200':
          $ref: '#/components/responses/Skill'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Skills]
      operationId: deleteSkill
      summary: Delete an unreferenced user-owned draft Skill
      responses:
        '204':
          description: Skill deleted
        default:
          $ref: '#/components/responses/Error'
  /v1/skill-versions:
    get:
      tags: [Skills]
      operationId: listSkillVersions
      summary: List immutable skill versions
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - name: skill_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/SkillVersionList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Skills]
      operationId: createSkillVersion
      summary: Create a declarative skill version
      description: The server applies RFC 8785 JCS to the nine declarative hash-domain fields and sets their lowercase SHA-256 content_hash.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/SkillVersionCreate'
      responses:
        '201':
          $ref: '#/components/responses/SkillVersion'
        default:
          $ref: '#/components/responses/Error'
  /v1/skill-versions/{skill_version_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/SkillVersionId'
    get:
      tags: [Skills]
      operationId: getSkillVersion
      summary: Get an immutable skill version
      responses:
        '200':
          $ref: '#/components/responses/SkillVersion'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [Skills]
      operationId: patchSkillVersion
      summary: Update an unpublished draft with optimistic concurrency
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        $ref: '#/components/requestBodies/SkillVersionPatch'
      responses:
        '200':
          $ref: '#/components/responses/SkillVersion'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Skills]
      operationId: deleteSkillVersion
      summary: Delete an unreferenced draft
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Draft deleted
        default:
          $ref: '#/components/responses/Error'
  /v1/skill-versions/{skill_version_id}/validate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/SkillVersionId'
    post:
      tags: [Skills]
      operationId: validateSkillVersion
      summary: Validate a draft and transition it to ready or rejected
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          $ref: '#/components/responses/ValidationReport'
        default:
          $ref: '#/components/responses/Error'
  /v1/skill-versions/{skill_version_id}/publish:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/SkillVersionId'
    post:
      tags: [Skills]
      operationId: publishSkillVersion
      summary: Publish an immutable user-owned SkillVersion
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        $ref: '#/components/requestBodies/PublishSkillVersion'
      responses:
        '200':
          $ref: '#/components/responses/SkillVersion'
        default:
          $ref: '#/components/responses/Error'
  /v1/skill-test-executions:
    get:
      tags: [Skills]
      operationId: listSkillTestExecutions
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/SkillTestExecutionList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Skills]
      operationId: createSkillTestExecution
      summary: Execute the stage-one deterministic local comparison evaluator
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/SkillTestExecutionCreate'
      responses:
        '201':
          $ref: '#/components/responses/SkillTestExecution'
        default:
          $ref: '#/components/responses/Error'
  /v1/skill-test-executions/{execution_id}:
    get:
      tags: [Skills]
      operationId: getSkillTestExecution
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - name: execution_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          $ref: '#/components/responses/SkillTestExecution'
        default:
          $ref: '#/components/responses/Error'
  /v1/generation-batches:
    get:
      tags: [Batches]
      operationId: listGenerationBatches
      summary: List durable generation batches in the active workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Generation batch page
          content:
            application/json:
              schema: { type: object }
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Batches]
      operationId: createGenerationBatch
      summary: Atomically create up to 5000 normal Runs under one batch
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '202':
          description: Durable batch accepted for dispatch
          content:
            application/json:
              schema: { type: object }
        default:
          $ref: '#/components/responses/Error'
  /v1/generation-batches/{batch_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - name: batch_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Batches]
      operationId: getGenerationBatch
      responses:
        '200':
          description: Aggregated generation batch
          content:
            application/json:
              schema: { type: object }
        default:
          $ref: '#/components/responses/Error'
  /v1/generation-batches/{batch_id}/items:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - name: batch_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Batches]
      operationId: listGenerationBatchItems
      summary: Page and filter Run-backed items without loading the whole batch
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string, maxLength: 300 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Filtered batch item page
          content:
            application/json:
              schema: { type: object }
        default:
          $ref: '#/components/responses/Error'
  /v1/generation-batches/{batch_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - name: batch_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Batches]
      operationId: cancelGenerationBatch
      summary: Idempotently request cancellation for every non-terminal Run in a batch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Cancellation requests have been persisted
          content:
            application/json:
              schema: { type: object }
        default:
          $ref: '#/components/responses/Error'
  /v1/generation-batches/{batch_id}/retry-failed:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - name: batch_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Batches]
      operationId: retryFailedGenerationBatch
      summary: Create a new immutable batch from the failed items in a source batch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '202':
          description: New retry batch accepted for dispatch
          content:
            application/json:
              schema: { type: object }
        default:
          $ref: '#/components/responses/Error'
  /v1/runs:
    get:
      tags: [Runs]
      operationId: listRuns
      summary: List runs in the active workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/RunList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Runs]
      operationId: createRun
      summary: Create an idempotent run with an immutable composition snapshot
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/RunCreate'
      responses:
        '201':
          $ref: '#/components/responses/Run'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/estimate:
    post:
      tags: [Runs]
      operationId: estimateRun
      summary: Validate an immutable run composition against current Worker capabilities
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
      requestBody:
        $ref: '#/components/requestBodies/RunCreate'
      responses:
        '200':
          description: Run estimate and executable capability gaps
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [cost, duration_seconds, capability_gaps, capabilities_known]
                properties:
                  cost:
                    type: object
                    additionalProperties: false
                    required: [amount, currency]
                    properties:
                      amount: { type: number, minimum: 0 }
                      currency: { type: string, enum: [CNY, USD] }
                  duration_seconds: { type: integer, minimum: 1 }
                  capability_gaps:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [capability, resource, message]
                      properties:
                        capability: { type: string }
                        resource: { type: string }
                        message: { type: string }
                  capabilities_known: { type: boolean }
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRun
      summary: Get an authorized run
      responses:
        '200':
          $ref: '#/components/responses/Run'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/{run_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: cancelRun
      summary: Request cancellation of a run
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Run'
        default:
          $ref: '#/components/responses/Error'
  /v1/steps:
    get:
      tags: [Steps]
      operationId: listSteps
      summary: List recoverable steps
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - name: run_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/StepList'
        default:
          $ref: '#/components/responses/Error'
  /v1/steps/{step_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/StepId'
    get:
      tags: [Steps]
      operationId: getStep
      summary: Get a recoverable step
      responses:
        '200':
          $ref: '#/components/responses/Step'
        default:
          $ref: '#/components/responses/Error'
  /v1/steps/{step_id}/retry:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/StepId'
    post:
      tags: [Steps]
      operationId: retryStep
      summary: Request an idempotent retry for an eligible step
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Step'
        default:
          $ref: '#/components/responses/Error'
  /v1/steps/{step_id}/review:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/StepId'
    post:
      tags: [Steps]
      operationId: reviewStep
      summary: Approve or reject a step waiting at a human review gate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepReviewRequest' }
      responses:
        '202':
          $ref: '#/components/responses/Step'
        default:
          $ref: '#/components/responses/Error'
  /v1/artifacts:
    get:
      tags: [Artifacts]
      operationId: listArtifacts
      summary: List artifact metadata for an authorized run
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - name: run_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/ArtifactList'
        default:
          $ref: '#/components/responses/Error'
  /v1/artifacts/{artifact_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [Artifacts]
      operationId: getArtifact
      summary: Get artifact metadata; content access uses a separate signed URL flow
      responses:
        '200':
          $ref: '#/components/responses/Artifact'
        default:
          $ref: '#/components/responses/Error'
  /v1/artifacts/{artifact_id}/content:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [Artifacts]
      operationId: getArtifactContent
      summary: Read a small text artifact inline or redirect to a signed download URL
      parameters:
        - name: inline
          in: query
          required: false
          description: Return integrity-checked JSON or text content directly for browser preview.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Inline JSON or text artifact content
          headers:
            X-Content-SHA256:
              schema: { type: string, pattern: '^[a-f0-9]{64}$' }
          content:
            application/json:
              schema: {}
            text/plain:
              schema: { type: string }
        '307':
          description: Temporary redirect to private object storage
          headers:
            Location:
              schema: { type: string, format: uri }
        default:
          $ref: '#/components/responses/Error'
  /v1/events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List durable events for an authorized run
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - name: run_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: after_sequence
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/EventList'
        default:
          $ref: '#/components/responses/Error'
  /v1/events/{event_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get a durable event
      responses:
        '200':
          $ref: '#/components/responses/Event'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    workspaceApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    WorkspaceHeader:
      name: X-Workspace-Id
      in: header
      required: false
      description: >-
        Reserved workspace boundary. In the current single-workspace runtime it
        may be omitted and resolves to the configured workspace. When supplied,
        it is ignored rather than selecting a tenant.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: '^[A-Za-z0-9._:-]+$'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted or unquoted numeric revision returned in ETag.
      schema:
        type: string
        minLength: 1
        maxLength: 32
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
    ChannelSearch:
      name: search
      in: query
      required: false
      description: Case-insensitive substring search across Channel name, slug, description, and handle.
      schema:
        type: string
        minLength: 1
        maxLength: 160
    ChannelPlatform:
      name: platform
      in: query
      required: false
      description: Case-insensitive exact platform filter; Channel platform values are stored in lowercase.
      schema:
        type: string
        minLength: 1
        maxLength: 80
    ChannelStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, paused, archived]
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChannelId:
      name: channel_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SkillId:
      name: skill_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SkillVersionId:
      name: skill_version_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetLibraryId:
      name: library_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetId:
      name: asset_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RenderPresetId:
      name: render_preset_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PipelineId:
      name: pipeline_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StepId:
      name: step_id
      in: path
      required: true
      description: Stable worker step id composed from the Run id and pipeline node key.
      schema:
        type: string
        minLength: 38
        maxLength: 101
        pattern: '^[0-9a-fA-F-]{36}:[a-z][a-z0-9_]{0,63}$'
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: event_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApiKeyId:
      name: key_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    AssetStatus:
      type: string
      enum: [processing, quarantined, ready, disabled, deleted]
    AssetKind:
      type: string
      enum: [image, video, audio, document, text, other]
    CopyrightStatus:
      type: string
      enum: [unknown, owned, licensed, public_domain, restricted]
    AnalysisStatus:
      type: string
      enum: [pending, running, completed, failed]
    Asset:
      type: object
      additionalProperties: false
      required: [schema_version, id, workspace_id, library_id, kind, title, description,
        metadata, copyright_status, status, analysis_status, revision, deleted_at, tags,
        created_by, created_at, updated_at, file]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        library_id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/AssetKind' }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 2000 }
        metadata: { type: object }
        copyright_status: { $ref: '#/components/schemas/CopyrightStatus' }
        status: { $ref: '#/components/schemas/AssetStatus' }
        analysis_status: { $ref: '#/components/schemas/AnalysisStatus' }
        revision: { type: integer, minimum: 1 }
        deleted_at: { type: [string, 'null'], format: date-time }
        tags: { type: array, maxItems: 64, items: { type: string, maxLength: 100 } }
