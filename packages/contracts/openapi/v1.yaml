        items: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/AssetBatchItem' } }
        add: { type: array, maxItems: 64, items: { type: string, maxLength: 100 } }
        remove: { type: array, maxItems: 64, items: { type: string, maxLength: 100 } }
    AssetBatchReanalysis:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/AssetBatchItem' } }
