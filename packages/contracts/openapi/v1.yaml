        user_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string, minLength: 1, maxLength: 160 }
        avatar_url: { type: [string, 'null'], maxLength: 2048 }
        locale: { type: string, pattern: '^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$' }
        timezone: { type: string, minLength: 1, maxLength: 100 }
        revision: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }
    AccountProfileUpdate:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 160 }
        avatar_url: { type: [string, 'null'], maxLength: 2048 }
        locale: { type: string, pattern: '^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$', default: zh-CN }
        timezone: { type: string, minLength: 1, maxLength: 100, default: Asia/Shanghai }
    CreationPreferences:
      type: object
      additionalProperties: false
      required: [user_id, workspace_id, default_language, default_aspect_ratio, default_duration_seconds, default_visibility, auto_quality_check, revision, updated_at]
      properties:
        user_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        default_language: { type: string }
        default_aspect_ratio: { type: string, enum: ['16:9', '9:16', '1:1', '4:3'] }
        default_duration_seconds: { type: integer, minimum: 15, maximum: 3600 }
        default_visibility: { type: string, enum: [private, workspace] }
        auto_quality_check: { type: boolean }
        revision: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }
    CreationPreferencesUpdate:
      type: object
      additionalProperties: false
      properties:
        default_language: { type: string, default: zh-CN }
        default_aspect_ratio: { type: string, enum: ['16:9', '9:16', '1:1', '4:3'], default: '16:9' }
        default_duration_seconds: { type: integer, minimum: 15, maximum: 3600, default: 180 }
        default_visibility: { type: string, enum: [private, workspace], default: private }
        auto_quality_check: { type: boolean, default: true }
