openapi: 3.1.0
info:
  title: FrameFactory Control API
  version: 1.0.0
  summary: Single-workspace content production API with a reserved workspace boundary
  description: >-
    Version 1 of the FrameFactory control-plane contract. The current product
    runs in one configured personal workspace. Workspace identifiers remain in
    resource contracts so a future multi-workspace mode does not require a
    breaking schema change, but clients do not need to choose a workspace.
    System-published and user-published skills use the same Skill and
    SkillVersion schemas, storage, and endpoints.
servers:
  - url: https://api.framefactory.example
    description: Example deployment
security:
  - bearerAuth: []
  - workspaceApiKey: []
tags:
  - name: Context
  - name: Account
  - name: Users
  - name: Workspaces
  - name: Channels
  - name: Skills
  - name: Asset libraries
  - name: Render presets
  - name: Pipelines
  - name: Runs
  - name: Full AI
  - name: Webpage Video
  - name: Steps
  - name: Artifacts
  - name: Events
paths:
  /v1/context:
    get:
      tags: [Context]
      operationId: getCurrentContext
      summary: Resolve the installation's current single-workspace context
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
      responses:
        '200':
          $ref: '#/components/responses/CurrentContext'
        default:
          $ref: '#/components/responses/Error'
  /v1/full-ai/options:
    get:
      tags: [Full AI]
      operationId: getFullAiOptions
      summary: Inspect the isolated generated-only pipeline and its fail-closed readiness
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
      responses:
        '200':
          description: Full-AI options and blockers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FullAiOptions' }
        default:
          $ref: '#/components/responses/Error'
  /v1/full-ai/estimate:
    post:
      tags: [Full AI]
      operationId: estimateFullAiRun
      summary: Freeze scene, candidate, billable-second, and provider quote bounds
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FullAiVideoSpec' }
      responses:
        '200':
          description: Ready quote or explicit blockers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FullAiEstimate' }
        default:
          $ref: '#/components/responses/Error'
  /v1/full-ai/runs:
    post:
      tags: [Full AI]
      operationId: createFullAiRun
      summary: Atomically create a generated-only record and its scheduler Run
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FullAiRunCreate' }
      responses:
        '201':
          description: Full-AI Run queued on the durable scheduler
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FullAiRun' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        default:
          $ref: '#/components/responses/Error'
  /v1/full-ai/runs/{full_ai_run_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - name: full_ai_run_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Full AI]
      operationId: getFullAiRun
      summary: Get a Full-AI Run and mapped scheduler/billing status
      responses:
        '200':
          description: Full-AI Run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FullAiRun' }
        default:
          $ref: '#/components/responses/Error'
  /v1/webpage-video/options:
    get:
      tags: [Webpage Video]
      operationId: getWebpageVideoOptions
      summary: Inspect fail-closed readiness and fixed viewport limits
      x-required-permission: url_capture:read
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
      responses:
        '200':
          description: Webpage-video options and explicit blockers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebpageVideoOptions' }
        default: { $ref: '#/components/responses/Error' }
  /v1/webpage-video/runs:
    post:
      tags: [Webpage Video]
      operationId: createWebpageVideoRun
      summary: Create an isolated public-HTTPS capture and video Run
      x-required-permission: url_capture:write
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebpageVideoRunCreate' }
      responses:
        '201':
          description: Webpage-video Run atomically bound to a scheduler Run
          headers:
            Location: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebpageVideoRun' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/webpage-video/pilot-summary:
    get:
      tags: [Webpage Video]
      operationId: getWebpageVideoPilotSummary
      summary: Aggregate privacy-minimized pilot evidence for application review
      x-required-permission: url_capture:read
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Workspace-scoped pilot evidence summary
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebpagePilotSummary' }
        default: { $ref: '#/components/responses/Error' }
  /v1/webpage-video/runs/{webpage_video_run_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/WebpageVideoRunId'
    get:
      tags: [Webpage Video]
      operationId: getWebpageVideoRun
      summary: Get independently mapped capture, composition, render, and QC status
      x-required-permission: url_capture:read
      responses:
        '200':
          description: Webpage-video Run; capture URLs are issued only by the capture endpoint
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebpageVideoRun' }
        default: { $ref: '#/components/responses/Error' }
  /v1/webpage-video/runs/{webpage_video_run_id}/capture:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/WebpageVideoRunId'
    get:
      tags: [Webpage Video]
      operationId: getWebpageVideoCapture
      summary: Get immutable screenshot evidence and a short-lived preview URL
      x-required-permission: url_capture:read
      responses:
        '200':
          description: Current capture evidence
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebpageCapture' }
        default: { $ref: '#/components/responses/Error' }
  /v1/webpage-video/runs/{webpage_video_run_id}/capture/review:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/WebpageVideoRunId'
    post:
      tags: [Webpage Video]
      operationId: reviewWebpageVideoCapture
      summary: Review screenshot bytes with revision and SHA-256 compare-and-swap binding
      x-required-permission: url_capture:review
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebpageCaptureReviewRequest' }
      responses:
        '202':
          description: Review durably recorded or semantically replayed
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebpageVideoRun' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/webpage-video/runs/{webpage_video_run_id}/site:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/WebpageVideoRunId'
    get:
      tags: [Webpage Video]
      operationId: getWebpageVideoSite
      summary: Get the discovered page scope, capture evidence, and proposed storyboard
      x-required-permission: url_capture:read
      responses:
        '200':
          description: Current site-discovery and storyboard state
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebpageSite' }
        default: { $ref: '#/components/responses/Error' }
  /v1/webpage-video/runs/{webpage_video_run_id}/scope/review:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/WebpageVideoRunId'
    post:
      tags: [Webpage Video]
      operationId: reviewWebpageVideoScope
      summary: Approve or revise the discovered page scope with compare-and-swap binding
      x-required-permission: url_capture:review
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebpageScopeReviewRequest' }
      responses:
        '202':
          description: Scope review durably recorded or semantically replayed
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebpageSite' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/webpage-video/runs/{webpage_video_run_id}/storyboard/review:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/WebpageVideoRunId'
    post:
      tags: [Webpage Video]
      operationId: reviewWebpageVideoStoryboard
      summary: Approve or revise the shot plan with compare-and-swap binding
      x-required-permission: url_capture:review
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebpageStoryboardReviewRequest' }
      responses:
        '202':
          description: Storyboard review durably recorded or semantically replayed
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebpageSite' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/webpage-video/runs/{webpage_video_run_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/WebpageVideoRunId'
    post:
      tags: [Webpage Video]
      operationId: cancelWebpageVideoRun
      summary: Request cancellation through the independent control plane
      x-required-permission: url_capture:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Cancellation requested
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebpageVideoRun' }
        default: { $ref: '#/components/responses/Error' }
  /v1/webpage-video/runs/{webpage_video_run_id}/pilot-feedback:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/WebpageVideoRunId'
    post:
      tags: [Webpage Video]
      operationId: saveWebpageVideoPilotFeedback
      summary: Create or revise privacy-minimized pilot outcome evidence
      x-required-permission: url_capture:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebpagePilotFeedbackSave' }
      responses:
        '200':
          description: Existing pilot feedback revised
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebpagePilotFeedback' }
        '201':
          description: Pilot feedback created
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebpagePilotFeedback' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/account/capabilities:
    get:
      tags: [Account]
      operationId: getAccountCapabilities
      summary: List account capabilities available in this release
      responses:
        '200':
          description: Account capability availability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountCapabilities' }
        default:
          $ref: '#/components/responses/Error'
  /v1/account/profile:
    get:
      tags: [Account]
      operationId: getAccountProfile
      summary: Get the current user's profile
      responses:
        '200':
          description: Current account profile
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountProfile' }
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [Account]
      operationId: replaceAccountProfile
      summary: Replace mutable fields in the current user's profile
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountProfileUpdate' }
      responses:
        '200':
          description: Updated account profile
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountProfile' }
        default:
          $ref: '#/components/responses/Error'
  /v1/account/creation-preferences:
    get:
      tags: [Account]
      operationId: getCreationPreferences
      summary: Get defaults used by the creation workflow
      responses:
        '200':
          description: Creation preferences
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreationPreferences' }
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [Account]
      operationId: replaceCreationPreferences
      summary: Replace defaults used by the creation workflow
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreationPreferencesUpdate' }
      responses:
        '200':
          description: Updated creation preferences
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreationPreferences' }
        default:
          $ref: '#/components/responses/Error'
  /v1/account/sessions:
    get:
      tags: [Account]
      operationId: listAccountSessions
      summary: List sessions belonging to the current user
      responses:
        '200':
          description: Account sessions; token and IP hashes are never returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccountSession' }
        default:
          $ref: '#/components/responses/Error'
  /v1/account/sessions/{session_id}:
    delete:
      tags: [Account]
      operationId: revokeAccountSession
      summary: Revoke one account session
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204': { description: Session revoked }
        default:
          $ref: '#/components/responses/Error'
  /v1/account/api-keys:
    get:
      tags: [Account]
      operationId: listAccountApiKeys
      summary: List API key metadata without secrets or hashes
      responses:
        '200':
          description: API key metadata
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKey' }
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Account]
      operationId: createAccountApiKey
      summary: Create an API key and return its plaintext exactly once
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyCreate' }
      responses:
        '201':
          description: API key metadata and one-time plaintext
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyCreated' }
        default:
          $ref: '#/components/responses/Error'
  /v1/account/api-keys/{key_id}:
    delete:
      tags: [Account]
      operationId: revokeAccountApiKey
      summary: Revoke one API key
      parameters:
        - $ref: '#/components/parameters/ApiKeyId'
      responses:
        '204': { description: API key revoked }
        default:
          $ref: '#/components/responses/Error'
  /v1/account/two-factor:
    post:
      tags: [Account]
      operationId: configureTwoFactor
      summary: Report that two-factor authentication is unavailable in this release
      responses:
        '501':
          $ref: '#/components/responses/Error'
  /v1/users:
    get:
      tags: [Reserved]
      operationId: listUsersReserved
      summary: Reserved user directory interface for a future release
      responses:
        '501': { $ref: '#/components/responses/Error' }
  /v1/users/{user_id}:
    get:
      tags: [Reserved]
      operationId: getUserReserved
      summary: Reserved user detail interface for a future release
      responses:
        '501': { $ref: '#/components/responses/Error' }
  /v1/workspaces:
    get:
      tags: [Reserved]
      operationId: listWorkspacesReserved
      summary: Reserved workspace list interface for a future release
      responses:
        '501': { $ref: '#/components/responses/Error' }
    post:
      tags: [Reserved]
      operationId: createWorkspaceReserved
      summary: Reserved workspace creation interface for a future release
      responses:
        '501': { $ref: '#/components/responses/Error' }
  /v1/workspaces/{workspace_id}:
    get:
      tags: [Reserved]
      operationId: getWorkspaceReserved
      summary: Reserved workspace detail interface for a future release
      responses:
        '501': { $ref: '#/components/responses/Error' }
  /v1/channels:
    get:
      tags: [Channels]
      operationId: listChannels
      summary: List publishing Channels in the configured workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ChannelSearch'
        - $ref: '#/components/parameters/ChannelPlatform'
        - $ref: '#/components/parameters/ChannelStatus'
      responses:
        '200': { $ref: '#/components/responses/ChannelList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Channels]
      operationId: createChannel
      summary: Create a Channel with durable default composition references
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ChannelWrite'
      responses:
        '201': { $ref: '#/components/responses/Channel' }
        default: { $ref: '#/components/responses/Error' }
  /v1/channels/{channel_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [Channels]
      operationId: getChannel
      summary: Get a Channel and its current default composition
      responses:
        '200': { $ref: '#/components/responses/Channel' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Channels]
      operationId: replaceChannel
      summary: Replace a Channel using its numeric ETag revision
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        $ref: '#/components/requestBodies/ChannelWrite'
      responses:
        '200': { $ref: '#/components/responses/Channel' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Channels]
      operationId: archiveChannel
      summary: Archive a Channel using its numeric ETag revision
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Channel archived }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/asset-libraries:
    get:
      tags: [Assets]
      operationId: listAssetLibraries
      summary: List durable asset libraries in the default workspace
      responses:
        '200': { description: Asset library page }
    post:
      tags: [Assets]
      operationId: createAssetLibrary
      summary: Create an asset library
      responses:
        '201': { description: Asset library created }
  /v1/asset-libraries/{library_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/AssetLibraryId'
    get:
      tags: [Assets]
      operationId: getAssetLibrary
      summary: Get an asset library and its readiness counts
      responses:
        '200': { description: Asset library }
        default: { $ref: '#/components/responses/Error' }
  /v1/library-build-jobs:
    post:
      tags: [Assets]
      operationId: createLibraryBuildJob
      summary: Persist and enqueue an out-of-Run topic-driven asset-library build
      x-required-scopes: [assets:write]
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryBuildJobCreate' }
      responses:
        '202':
          description: Durable library build accepted for asynchronous discovery, transfer, analysis, and indexing
          headers:
            Location: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryBuildJob' }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/library-build-jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - name: job_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Assets]
      operationId: getLibraryBuildJob
      summary: Get durable library-build state and stage progress
      x-required-scopes: [assets:read]
      responses:
        '200':
          description: Library build job
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryBuildJob' }
        default: { $ref: '#/components/responses/Error' }
  /v1/library-build-jobs/{job_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - name: job_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Assets]
      operationId: cancelLibraryBuildJob
      summary: Revision-fence cancellation of a queued or running library build
      x-required-scopes: [assets:write]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '202':
          description: Cancellation persisted
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryBuildJob' }
        '412': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/asset-libraries/{library_id}/assets:
    parameters:
      - $ref: '#/components/parameters/WorkspaceHeader'
      - $ref: '#/components/parameters/AssetLibraryId'
    get:
      tags: [Assets]
      operationId: listLibraryAssets
      summary: List workspace-scoped assets using a filter-bound keyset cursor
