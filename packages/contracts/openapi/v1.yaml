      type: object
      additionalProperties: false
      required: [mode, user_id, workspace_id, workspace_name, workspace_header_required, multi_tenant_features_enabled]
      properties:
        mode: { type: string, const: single_workspace }
        user_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        workspace_name: { type: string, minLength: 1, maxLength: 160 }
