        items: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/AssetBatchItem' } }
        target_status: { type: string, enum: [processing, quarantined, ready, disabled] }
        reason: { type: string, minLength: 1, maxLength: 2000 }
