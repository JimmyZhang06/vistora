[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "framefactory-api"
version = "0.1.0"
description = "FrameFactory control-plane API"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "fastapi>=0.116,<1",
  "jsonschema>=4.26,<5",
  "playwright==1.62.0",
  "redis>=5.2,<8",
  "rfc8785>=0.1.4,<1",
  "uvicorn[standard]>=0.35,<1",
  "yt-dlp>=2025.6.30,<2027",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "PyYAML>=6.0.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/framefactory_api"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
